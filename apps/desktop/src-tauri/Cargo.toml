[package]
name = "vyrion-desktop"
version = "0.1.0-alpha.1"
description = "Vyrion ERP — desktop application"
authors = ["VyrnCore Enterprises"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "vyrion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
