[package]
name = "vyrion-desktop"
version = "0.1.0-alpha.1"
description = "Vyrion ERP — desktop application"
authors = ["VyrnCore Enterprises"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "vyrion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
serde_json = "1.0.154"
sysinfo = "0.36.1"
sha2 = "0.10.9"
getrandom = "0.3.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"

# The OS credential store holds the database key on the platforms the app ships for.
# Linux is not a target: there the key falls back to a 0600 file (see keystore.rs).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
