name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release tooling (tests, version consistency)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every version file agrees
        run: python3 tools/release/version.py check
      - name: Tests
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Shell script lint
        run: shellcheck tools/release/prune.sh

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vyrion_test
          POSTGRES_USER: vyrion
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyrion -d vyrion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VYRION_ENVIRONMENT: test
      VYRION_DATABASE_URL: postgresql+psycopg://vyrion:ci-only-password@127.0.0.1:5432/vyrion_test
      VYRION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Unit + integration tests: PostgreSQL and Redis are real services here.
      - run: uv run pytest -ra
      - name: Dependency audit
        run: uv run pip-audit

  desktop:
    name: Desktop frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (shipped dependencies)
        run: pnpm audit --prod

  tauri:
    name: Desktop shell (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # generate_context! embeds the frontend bundle directory at compile time.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependency audit (known vulnerabilities)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  infra:
    name: Server stack (Compose config, image build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        working-directory: infra
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image
        run: docker build --tag vyrion-backend:ci backend
