name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Release tooling (tests, version consistency)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every version file agrees
        run: python3 tools/release/version.py check
      - name: Tests
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Shell script lint
        run: shellcheck tools/release/prune.sh

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vyrion_test
          POSTGRES_USER: vyrion
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyrion -d vyrion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VYRION_ENVIRONMENT: test
      VYRION_DATABASE_URL: postgresql+psycopg://vyrion:ci-only-password@127.0.0.1:5432/vyrion_test
      VYRION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Unit + integration tests: PostgreSQL and Redis are real services here.
      - run: uv run pytest -ra
      - name: Dependency audit
        run: uv run pip-audit

  desktop:
    name: Desktop frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (shipped dependencies)
        run: pnpm audit --prod

  tauri:
    name: Desktop shell (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # generate_context! embeds the frontend bundle directory at compile time.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependency audit (known vulnerabilities)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  e2e:
    name: End-to-end (desktop sync + console against the real server)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vyrion_e2e
          POSTGRES_USER: vyrion
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyrion -d vyrion_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VYRION_ENVIRONMENT: development
      VYRION_DATABASE_URL: postgresql+psycopg://vyrion:ci-only-password@127.0.0.1:5432/vyrion_e2e
      VYRION_REDIS_URL: redis://127.0.0.1:6379/0
      E2E_PASSWORD: ci-only-E2E-passphrase-42
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start the server
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          key="$(uv run python -m app.cli generate-key)"
          export VYRION_ENCRYPTION_KEYS="$key"
          uv run alembic upgrade head
          uv run python -m app.cli bootstrap
          uv run python - <<'PY'
          import asyncio, os
          from app.cli import create_admin
          asyncio.run(create_admin("e2e@example.com", "E2E Admin", os.environ["E2E_PASSWORD"]))
          PY
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/v1/health/ready && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/v1/health/ready
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Sync and console flows against the server
        working-directory: apps/desktop
        env:
          VYRION_E2E_URL: http://127.0.0.1:8000
          VYRION_E2E_EMAIL: e2e@example.com
          VYRION_E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: pnpm vitest run src/sync/__tests__/e2e.test.ts
      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  backup:
    name: Backup scripts (lint, end-to-end on PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vyrion_backup_test
          POSTGRES_USER: vyrion
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyrion -d vyrion_backup_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install age and the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq age jq postgresql-client-18
      - name: Shell lint
        run: shellcheck -x -S warning infra/backup/*.sh
      - name: Backup, verify, tamper, restore (real PostgreSQL)
        env:
          PGHOST: 127.0.0.1
          PGUSER: vyrion
          PGPASSWORD: ci-only-password
          PGDATABASE: vyrion_backup_test
        run: infra/backup/test.sh

  infra:
    name: Server stack (Compose config, image build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        working-directory: infra
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image
        run: docker build --tag vyrion-backend:ci backend
      - name: Build backup image
        run: docker build --tag vyrion-backup:ci infra/backup
