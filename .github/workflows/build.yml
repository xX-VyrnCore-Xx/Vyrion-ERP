name: Build

# Builds the Windows and macOS (Apple Silicon) installers on every pull request that can
# affect them, so a broken build is found before the merge. The installers are unsigned and
# kept for a week. Builds of main are made by release.yml, which publishes them.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "tools/release/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop installers
    uses: ./.github/workflows/build-desktop.yml
    with:
      sign: false
      retention-days: 7
