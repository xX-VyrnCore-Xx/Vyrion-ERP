name: Build desktop

# Single definition of how the desktop installers are built. It is called by:
#   - build.yml    on pull requests and main (unsigned, to catch breakage early)
#   - release.yml  on a version tag (signed when the secrets exist)
#
# Targets: Windows x64 (NSIS) and macOS Apple Silicon (DMG). There is deliberately no
# macOS Intel build.

on:
  workflow_call:
    inputs:
      sign:
        description: Sign and notarize macOS builds when the repository secrets exist
        type: boolean
        default: false
      retention-days:
        description: How long the installers are kept as workflow artifacts
        type: number
        default: 7
      version:
        description: >-
          Version to build. When empty, the version written in the files is used; when set
          (automatic releases from main) it is written into the build's working copy only.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 tools/release/version.py check
          echo "version=${OVERRIDE:-$(python3 tools/release/version.py get)}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x64
            asset: Windows-x64-Setup
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            slug: macos-arm64
            asset: macOS-AppleSilicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Shown in the app's About panel.
      VITE_APP_COMMIT: ${{ github.sha }}
    steps:
      # Newer Git prints a long hint about the default branch name every time the checkout
      # initialises the repository; the repository's name for it is irrelevant here.
      - name: Silence Git's default-branch hint
        # The job's default folder (apps/desktop) does not exist before the checkout.
        working-directory: ${{ github.workspace }}
        run: git config --global advice.defaultBranchName false
      - uses: actions/checkout@v7
      # Automatic releases number themselves: the version is written into this build's
      # working copy (not committed) so the installer, its file name and the tag agree.
      - name: Apply the release version
        if: inputs.version != ''
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" tools/release/version.py set "$VERSION"
          "$py" tools/release/version.py check
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      # SQLCipher is built against a vendored OpenSSL, which needs a complete Perl. The Perl
      # that ships with Git for Windows lacks modules, so Windows uses Strawberry Perl. Set on
      # Windows only: an empty value on macOS would be taken as a command named "".
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      # Signing and notarization are opt-in: only for tagged releases (inputs.sign) and only
      # when the repository secrets exist. Nothing sensitive is stored in the repository, and
      # pull-request builds never see the certificate.
      - name: Detect macOS signing secrets
        if: inputs.sign && runner.os == 'macOS'
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Enable macOS signing and notarization
        if: steps.apple.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Multi-line safe form of writing to GITHUB_ENV.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            {
              echo "$name<<VYRION_EOF_$name"
              echo "${!name}"
              echo "VYRION_EOF_$name"
            } >> "$GITHUB_ENV"
          done

      # In-app updates need signed packages. They are produced only for releases (inputs.sign)
      # and only when the repository secret TAURI_SIGNING_PRIVATE_KEY exists; without it the
      # installers are built as before and the release carries no update manifest.
      - name: Enable signed update packages
        if: inputs.sign
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: no signed update packages"
            exit 0
          fi
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            {
              echo "$name<<VYRION_EOF_$name"
              echo "${!name}"
              echo "VYRION_EOF_$name"
            } >> "$GITHUB_ENV"
          done
          # The job's working directory is apps/desktop (see "defaults" above).
          mkdir -p src-tauri
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/updater.conf.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "args=--config src-tauri/updater.conf.json" >> "$GITHUB_OUTPUT"
          # macOS: building only the disk image leaves no .app behind; the update package is
          # made from the app bundle, so build that one too.
          if [ "$RUNNER_OS" = "macOS" ]; then echo "extra=,app" >> "$GITHUB_OUTPUT"; fi

      # Windows installers get an Authenticode signature from a certificate made on the spot
      # (self-signed, no purchased certificate and no secret): the files are signed and carry
      # "VyrnCore Enterprises" as publisher, but Windows does not trust the certificate, so
      # SmartScreen still warns. A bought certificate would replace this step.
      - name: Self-signed Authenticode certificate (Windows)
        if: runner.os == 'Windows'
        id: winsign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=VyrnCore Enterprises, O=VyrnCore Enterprises' `
            -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(3)
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
          } } } | ConvertTo-Json -Depth 6
          New-Item -ItemType Directory -Force src-tauri | Out-Null
          Set-Content -Path src-tauri/sign.conf.json -Value $conf -Encoding utf8NoBOM
          Write-Host "certificate $($cert.Thumbprint) created"
          "args=--config src-tauri/sign.conf.json" >> $env:GITHUB_OUTPUT

      - run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm test
      - name: Build installer
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}${{ steps.updater.outputs.extra }}" ${{ steps.updater.outputs.args }} ${{ steps.winsign.outputs.args }}

      - name: Collect the installer
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundles }}"
          mkdir -p ../../dist-release
          shopt -s nullglob
          case "${{ matrix.bundles }}" in
            nsis) files=("$bundle_dir"/*.exe); ext=exe ;;
            dmg)  files=("$bundle_dir"/*.dmg); ext=dmg ;;
          esac
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one installer in $bundle_dir, found ${#files[@]}"
            ls -la "$bundle_dir" || true
            exit 1
          fi
          out="../../dist-release/Vyrion-ERP_${VERSION}_${{ matrix.asset }}.${ext}"
          cp "${files[0]}" "$out"
          # macOS: the app inside is already signed ad hoc; sign the disk image the same way
          # (no certificate). Apple still does not trust it: that needs notarization.
          if [ "${{ matrix.bundles }}" = "dmg" ]; then
            codesign --force --sign - "$out"
            codesign --verify --verbose "$out"
          fi
          size=$(wc -c < "$out")
          echo "installer: $out ($size bytes)"
          # A broken build produces kilobytes; the real installers are a few megabytes.
          if [ "$size" -lt 1000000 ]; then
            echo "::error::installer is suspiciously small ($size bytes)"
            exit 1
          fi

          # Signed update package (see "Enable signed update packages"): the Windows installer
          # itself with its .sig, the zipped app with its .sig on macOS.
          if [ "${{ steps.updater.outputs.enabled }}" = "true" ]; then
            case "${{ matrix.bundles }}" in
              nsis)
                sig=("$bundle_dir"/*.exe.sig)
                if [ "${#sig[@]}" -ne 1 ]; then echo "::error::update signature not found in $bundle_dir"; exit 1; fi
                cp "${sig[0]}" "$out.sig"
                ;;
              dmg)
                macdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
                pkg="../../dist-release/Vyrion-ERP_${VERSION}_${{ matrix.asset }}.app.tar.gz"
                tar=("$macdir"/*.app.tar.gz)
                if [ "${#tar[@]}" -eq 1 ] && [ -f "${tar[0]}.sig" ]; then
                  cp "${tar[0]}" "$pkg"
                  cp "${tar[0]}.sig" "$pkg.sig"
                else
                  # Building only the disk image may not leave the zipped app behind: make it
                  # from the .app that the disk image was built from, and sign it here.
                  echo "::notice::no .app.tar.gz from the bundler: packing and signing the app"
                  app=("$macdir"/*.app)
                  if [ "${#app[@]}" -ne 1 ]; then
                    echo "::error::app bundle not found in $macdir"
                    ls -la "$macdir" || true
                    exit 1
                  fi
                  COPYFILE_DISABLE=1 tar -czf "$pkg" -C "$macdir" "$(basename "${app[0]}")"
                  pnpm tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
                    -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$pkg"
                  test -f "$pkg.sig" || { echo "::error::signature was not written"; exit 1; }
                fi
                ;;
            esac
            echo "signed update package collected"
          fi

      # Real smoke tests of what users will actually run.
      - name: Check the Authenticode signature of the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $installer = Get-ChildItem dist-release -Filter *.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "status: $($sig.Status)"
          Write-Host "signer: $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate) { throw 'The installer is not signed' }
          if ($sig.SignerCertificate.Subject -notmatch 'VyrnCore Enterprises') {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
      - name: Smoke test the Windows installer (silent install and uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $installer = (Get-ChildItem dist-release -Filter *.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'vyrion-smoke'
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait
          $installed = Get-ChildItem $target -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' }
          if (-not $installed) {
            Get-ChildItem $target -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
            throw "No application executable was installed into $target"
          }
          Write-Host "Installed: $($installed.Name) ($([math]::Round($installed[0].Length / 1MB, 1)) MB)"
          $uninstaller = Get-ChildItem $target -Filter 'uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'The uninstaller is missing' }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          $left = Get-ChildItem $target -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' }
          if ($left) { throw 'The application was not removed by the uninstaller' }
          Write-Host 'Install and uninstall succeeded'
      - name: Smoke test the macOS disk image
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dmg="$(find dist-release -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify "$dmg"
          mount_point="$(mktemp -d)"
          # The image carries the terms of use, which hdiutil asks to accept; answer "Y" for it.
          echo Y | hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null \
            || { echo "::error::cannot mount the disk image"; exit 1; }
          trap 'hdiutil detach "$mount_point" >/dev/null || true' EXIT
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "::error::no .app bundle inside the disk image"; exit 1; }
          echo "app bundle: $app"
          binary="$(find "$app/Contents/MacOS" -type f -perm -u+x -print -quit)"
          test -n "$binary" || { echo "::error::no executable inside the app bundle"; exit 1; }
          lipo -archs "$binary" | tee /dev/stderr | grep -q arm64
          # The bundle must carry a VALID signature, ad hoc at least: an invalid one is what
          # macOS reports as "damaged and can't be opened". (Notarization is a separate matter.)
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|flags" || true
          if ! codesign --verify --deep --strict "$app"; then
            echo "::error::the app bundle signature is invalid: macOS would call the app damaged"
            exit 1
          fi
          spctl --assess --type execute "$app" || echo "::notice::not notarized: Gatekeeper asks for confirmation on first launch"

      - name: Checksum
        working-directory: ${{ github.workspace }}/dist-release
        run: |
          set -euo pipefail
          for file in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"
            else shasum -a 256 "$file" > "$file.sha256"; fi
          done
          cat ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.slug }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
