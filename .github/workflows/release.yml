name: Release

# Pushing a tag vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N builds the desktop installers for
# Windows and macOS (Apple Silicon), publishes a GitHub release and then prunes releases
# older than the newest three. See docs/RELEASING.md.
#
# The same release can be started by hand (Actions -> Release -> Run workflow) with the
# version number: the workflow then creates the tag itself on the tip of main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-alpha.1 (must match the version files on main)"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag format and version files
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::start the release from the main branch"
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          python3 tools/release/version.py check --tag "$tag"
          version="${tag#v}"
          if [[ "$tag" == *-* ]]; then pre=true; else pre=false; fi
          # "0.1.0-alpha.1" -> "Vyrion ERP 0.1.0 Alpha 1"
          title="$(python3 - "$version" <<'PY'
          import re, sys
          v = sys.argv[1]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", v)
          if not m:
              raise SystemExit("unexpected version " + v)
          core, channel, n = m.groups()
          names = {"alpha": "Alpha", "beta": "Beta", "rc": "Release Candidate"}
          print(f"Vyrion ERP {core}" + (f" {names[channel]} {n}" if channel else ""))
          PY
          )"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$pre"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: A pushed tag must point at a commit on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only."
            exit 1
          fi
      - name: The tag must not exist yet (manual start)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists; use a new version number"
            exit 1
          fi
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools/release -p "test_*.py"

  build:
    name: Build installers
    needs: verify
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit # macOS signing and notarization secrets, when present
    with:
      sign: true
      retention-days: 30

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      TITLE: ${{ needs.verify.outputs.title }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installer-*
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Every build already wrote a .sha256 next to its installer; publish one file.
          cat ./*.sha256 > SHA256SUMS.txt
          rm -- ./*.sha256
          # Re-verify what was downloaded: the artifact must match what was built.
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "# $TITLE"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Versione di anteprima.** Pensata per prove e valutazioni, non per la produzione."
              echo
            fi
            python3 tools/release/version.py notes "$VERSION"
            echo
            echo "## Scarica"
            echo
            echo "| Sistema | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (64 bit) | \`Vyrion-ERP_${VERSION}_Windows-x64-Setup.exe\` |"
            echo "| macOS 12 o successivo (Apple Silicon) | \`Vyrion-ERP_${VERSION}_macOS-AppleSilicon.dmg\` |"
            echo
            echo "- **Windows:** doppio clic sul file; l'installazione è per utente e non richiede l'amministratore."
            echo "- **macOS:** apri il file, trascina Vyrion ERP in Applicazioni. Se l'app non è firmata, al primo avvio usa clic destro → Apri."
            echo "- Verifica l'integrità del download con \`SHA256SUMS.txt\`."
            echo "- L'app funziona subito, offline, senza server."
          } > notes.md
      - name: Create or update the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a previous attempt: replace the assets, keep the release.
            gh release upload "$TAG" assets/* --clobber
          else
            flags=(--title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${flags[@]}" assets/*
          fi

  prune:
    name: Prune old releases
    needs: [verify, release]
    permissions:
      contents: write
    uses: ./.github/workflows/prune-releases.yml
    with:
      keep: 3
      dry_run: false
      current_tag: ${{ needs.verify.outputs.tag }}
