name: Release

# Every push to main that changes the app builds the Windows and macOS (Apple Silicon)
# installers, creates a NEW tag and publishes a GitHub release with the files; then the
# releases older than the newest three are pruned. See docs/RELEASING.md.
#
# Automatic releases are always FINAL (stable vX.Y.Z, a normal release marked "latest"). The
# number is chosen by tools/release/next_version.py: the version in the files if that line has
# no release yet, otherwise the next patch number. Two other ways in are kept: pushing a tag by
# hand, and Actions -> Release -> Run workflow with a version (these may be pre-releases).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-alpha.3 (must match the version files on main)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/build-desktop.yml"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

# One release at a time, whatever started it: numbers are chosen from the tags that exist.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  verify:
    name: Choose the version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      title: ${{ steps.meta.outputs.title }}
      automatic: ${{ steps.meta.outputs.automatic }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Version, tag and title
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          automatic=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::start the release from the main branch"
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            python3 tools/release/version.py check --tag "$tag"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists; use a new version number"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            automatic=true
            python3 tools/release/version.py check
            current="$(python3 tools/release/version.py get)"
            # shellcheck disable=SC2046
            version="$(python3 tools/release/next_version.py "$current" $(git tag --list 'v*'))"
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
            python3 tools/release/version.py check --tag "$tag"
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$tag is not on main; releases are cut from main only."
              exit 1
            fi
          fi
          version="${tag#v}"
          if [[ "$tag" == *-* ]]; then pre=true; else pre=false; fi
          # "0.1.0-alpha.3" -> "Vyrion ERP 0.1.0 Alpha 3"
          title="$(python3 - "$version" <<'PY'
          import re, sys
          v = sys.argv[1]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", v)
          if not m:
              raise SystemExit("unexpected version " + v)
          core, channel, n = m.groups()
          names = {"alpha": "Alpha", "beta": "Beta", "rc": "Release Candidate"}
          print(f"Vyrion ERP {core}" + (f" {names[channel]} {n}" if channel else ""))
          PY
          )"
          {
            echo "release=true"
            echo "automatic=$automatic"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$pre"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $title as $tag"

  build:
    name: Build installers
    needs: verify
    if: needs.verify.outputs.release == 'true'
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit # macOS signing and notarization secrets, when present
    with:
      sign: true
      retention-days: 30
      version: ${{ needs.verify.outputs.version }}

  release:
    name: Publish release
    needs: [verify, build]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      TITLE: ${{ needs.verify.outputs.title }}
      AUTOMATIC: ${{ needs.verify.outputs.automatic }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installer-*
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Every build already wrote a .sha256 next to its installer; publish one file.
          cat ./*.sha256 > SHA256SUMS.txt
          rm -- ./*.sha256
          # Re-verify what was downloaded: the artifact must match what was built.
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "# $TITLE"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Versione di anteprima.** Pensata per prove e valutazioni, non per la produzione."
              echo
            fi
            if section="$(python3 tools/release/version.py notes "$VERSION" 2>/dev/null)" && [ -n "$section" ]; then
              printf '%s\n' "$section"
            else
              echo "Build automatica del commit \`${SHA:0:7}\` su \`main\`: l'elenco delle modifiche è sotto."
              echo
              echo "Limiti noti e cosa non è ancora disponibile: \`docs/MODULES.md\` e \`docs/SYNC_ENGINE.md\`."
            fi
            echo
            echo "## Scarica"
            echo
            echo "| Sistema | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (64 bit) | \`Vyrion-ERP_${VERSION}_Windows-x64-Setup.exe\` |"
            echo "| macOS 12 o successivo (Apple Silicon) | \`Vyrion-ERP_${VERSION}_macOS-AppleSilicon.dmg\` |"
            echo
            echo "- **Windows:** doppio clic sul file; l'installazione è per utente e non richiede l'amministratore."
            echo "- **macOS:** apri il file e trascina Vyrion ERP in Applicazioni. L'app non è notarizzata da Apple: al primo avvio macOS può dire che non può verificarla (o, con file scaricati da un browser, che è «danneggiata»). Vai in *Impostazioni di Sistema → Privacy e sicurezza → Apri comunque*, oppure da Terminale: \`xattr -dr com.apple.quarantine \"/Applications/Vyrion ERP.app\"\` e riapri l'app."
            echo "- **Windows:** nella barra delle applicazioni (vicino all'orologio) compare l'icona di Vyrion ERP: clic destro per le azioni rapide e per «Esci definitivamente»."
            echo "- Verifica l'integrità del download con \`SHA256SUMS.txt\`."
            echo "- L'app funziona subito, offline, senza server."
          } > notes.md
      - name: Create or update the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a previous attempt: replace the assets, keep the release.
            gh release upload "$TAG" assets/* --clobber
          else
            flags=(--title "$TITLE" --notes-file notes.md --generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${flags[@]}" assets/*
          fi

  prune:
    name: Prune old releases
    needs: [verify, release]
    if: needs.verify.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/prune-releases.yml
    with:
      keep: 3
      dry_run: false
      current_tag: ${{ needs.verify.outputs.tag }}
