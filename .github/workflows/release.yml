name: Release

# Pushing a tag vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N builds the desktop installers for
# Windows and macOS (Apple Silicon), publishes a GitHub release and then prunes releases
# older than the newest three. See docs/RELEASING.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag format and version files
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          python3 tools/release/version.py check --tag "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then pre=true; else pre=false; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: The tag must point at a commit on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only."
            exit 1
          fi
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools/release -p "test_*.py"

  build:
    name: Build installers
    needs: verify
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit # macOS signing and notarization secrets, when present
    with:
      sign: true
      retention-days: 30

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installer-*
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Every build already wrote a .sha256 next to its installer; publish one file.
          cat ./*.sha256 > SHA256SUMS.txt
          rm -- ./*.sha256
          # Re-verify what was downloaded: the artifact must match what was built.
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          set -euo pipefail
          {
            python3 tools/release/version.py notes "$VERSION"
            echo
            echo "## Installazione"
            echo
            echo "- **Windows:** \`vyrion-erp_${VERSION}_windows-x64.exe\`"
            echo "- **macOS (Apple Silicon):** \`vyrion-erp_${VERSION}_macos-arm64.dmg\`"
            echo
            echo "Verifica l'integrità del file scaricato con \`SHA256SUMS.txt\`."
            if [ "$PRERELEASE" = "true" ]; then
              echo
              echo "> Versione di anteprima (\`$VERSION\`): non destinata alla produzione."
            fi
          } > notes.md
      - name: Create or update the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a previous attempt: replace the assets, keep the release.
            gh release upload "$TAG" assets/* --clobber
          else
            flags=(--verify-tag --title "Vyrion ERP $VERSION" --notes-file notes.md --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${flags[@]}" assets/*
          fi

  prune:
    name: Prune old releases
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/prune-releases.yml
    with:
      keep: 3
      dry_run: false
      current_tag: ${{ github.ref_name }}
