# Vyrion ERP — server stack (Ubuntu Server on Proxmox VE).
# Usage: cp .env.example .env  ->  fill in the secrets  ->  docker compose up -d
name: vyrion

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      # Local, reliable server storage. Never an ordinary NAS share.
      # PostgreSQL 18+ images keep data in a per-major-version directory below
      # /var/lib/postgresql, so the volume must be mounted there, not on .../data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build: ../backend
    image: vyrion-backend:${VYRION_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      VYRION_ENVIRONMENT: ${VYRION_ENVIRONMENT:-production}
      VYRION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VYRION_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Fernet key(s) protecting stored secrets (2FA seeds). Comma-separated; first one encrypts.
      VYRION_ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?required}
      VYRION_BACKUP_DIR: /backups
    volumes:
      # Read-only: the API can show the backups but never alter or delete them.
      - backups:/backups:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  backup:
    build: ./backup
    image: vyrion-backup:${VYRION_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Public key only: the private key stays offline, so a stolen backup is unreadable.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?required (age public key, see docs/BACKUP.md)}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
    volumes:
      - backups:/backups
      # Optional second destination. Point BACKUP_COPY_PATH at another disk or share.
      - ${BACKUP_COPY_PATH:-backup_copy}:${BACKUP_COPY_DIR:-/backup-copy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    environment:
      VYRION_SERVER_NAME: ${VYRION_SERVER_NAME:?required}
    ports:
      # Bind ONLY to the WireGuard interface address: the API must not face the Internet.
      - "${VYRION_BIND_ADDRESS:?required}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backups:
  backup_copy:

networks:
  internal:
